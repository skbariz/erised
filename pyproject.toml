[project]
name = "erised"
version = "0.1.0"
description = "Walk-forward backtesting and research framework for systematic equity and multi-asset strategies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Erised contributors" }]
requires-python = ">=3.11"
keywords = ["backtesting", "quant", "walk-forward", "trading", "portfolio", "risk-parity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
research = [
    "lxml>=6.1.1",
    "matplotlib>=3.8",
]
live = [
    "alpaca-py>=0.30",
]

[project.scripts]
erised = "erised.cli:main"

[project.urls]
Homepage = "https://github.com/skbariz/erised"
Documentation = "https://github.com/skbariz/erised/tree/main/docs"
Issues = "https://github.com/skbariz/erised/issues"
Changelog = "https://github.com/skbariz/erised/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pyright>=1.1.409",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erised"]

[tool.hatch.build.targets.sdist]
include = ["/src/erised", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
# research/ is a frozen archive of one-off experiment runners; it is not linted.
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET"]
ignore = ["E501", "RET504"]

[tool.ruff.lint.per-file-ignores]
# Matrix/statistics notation (X, W, Sigma) is clearer than snake_case here.
"src/erised/strategies/*.py" = ["N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
